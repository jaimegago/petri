name: svc-image

# Publishes the application image (docs/application-image.md) on a tag push.
#
# Tag form: svc/v<version>, e.g. svc/v0.1.0 publishes ghcr.io/jaimegago/svc:0.1.0.
# The version the tag carries must be the one fault.AppImage pins; the check
# below refuses to publish otherwise. The build goes through the Makefile's
# svc-push target, so CI and a laptop build the same thing — there is no second
# build path. No human holds a registry credential: the workflow's own
# GITHUB_TOKEN, scoped packages: write, is the only one.

on:
  push:
    tags:
      - "svc/v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#svc/v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the pin in fault.AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pin=$(sed -n 's/^const AppImage = "ghcr.io\/jaimegago\/svc:\(.*\)"$/\1/p' pkg/fault/fault.go)
          if [ "$pin" != "$VERSION" ]; then
            echo "tag carries $VERSION but fault.AppImage pins $pin" >&2
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: images/svc/go.mod

      - name: Test the nested module
        run: make svc-test

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        run: make svc-push SVC_VERSION=${{ steps.version.outputs.version }}
